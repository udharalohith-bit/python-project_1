{% extends "base.html" %}{% block content %}
<h1>Add Synthetic Patient</h1><form method="post" class="col-md-6">
<label class="form-label">Age band</label><select class="form-select mb-3" name="age_band" required>
<option value="">Choose...</option>{% for a in ["0-17","18-29","30-44","45-59","60+"] %}<option>{{ a }}</option>{% endfor %}</select>
<label class="form-label">Gender (optional)</label><select class="form-select mb-3" name="gender"><option value="">Not specified</option><option>Female</option><option>Male</option><option>Other</option></select>
<button class="btn btn-primary">Save patient</button></form>{% endblock %}
